# Example config, every key is optional and shown here with its default.
# Unknown keys are an error.

# Cleaning steps in order, see cleaning.py
pipeline = ["subtract_pedestals", "remove_empty", "common_mode", "time_cut", "channel_cut"]

empty_channels = [0, 63, 64, 127, 128, 191, 192, 256]
allowance = 5

# Region of interest
chmin = 155
chmax = 180

# Channel used to find the focus
chfocus = 165

# Angle correction

# |adc_clean| above this is a hit
hit_threshold = 60

# Delay search
time_threshold = 60

default_delay = 50
default_time_window = 10.0
# Just uses default values
use_default_delay = false

# Make a plot after each cleaning step for this run
plot_run = 100

chunk_size = 100

# Only use scan positions inside this range, leave out for all
# zmin = 31.0
# zmax = 32.5
xmin = 11
xmax = 12

# Pitch is negative for a frontside-scan
pitch = -0.055 # mm
depth = 0.210 # mm

eta_neighbours = 1

update_config = true

style = "/home/teleuser/ELAD/tct/elad-tct-analysis/config/paper-style.mplstyle"

# Systematic errors on the Standa stages
xerr = 0.00125 # 1.25 micron
zerr = 0.00125 # 1.25 micron

# Peak shape fitted in x for the sigma: "box_gaussian" or "gaussian"
fit_model = "gaussian"

